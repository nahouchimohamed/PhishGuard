# Local training scrape config — keep intervals aligned with Grafana refresh (10s).
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # API counters: launches, reports, clicks, HTTP metrics
  - job_name: phishguard-api
    static_configs:
      - targets: ["api:8080"]

  # Worker counters: deliveries
  - job_name: phishguard-worker
    static_configs:
      - targets: ["worker:8081"]
